let selectedDay=fallbackDay();
if(!plans[selectedDay])selectedDay="maandag";
let activities=plans[selectedDay];
let done=new Set(),forced=new Set(),open=-1,mode="child",client=null,session=null;
const main=document.getElementById("main");

function mins(s){let [h,m]=s.split(":").map(Number);return h*60+m}
function escHtml(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}

function doneKey(day=selectedDay){
 const d=new Date();
 const date=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
 return "mijnDagDone_"+date+"_"+day;
}
function saveProgress(){
 localStorage.setItem(doneKey(),JSON.stringify([...done]));
 localStorage.setItem(doneKey()+"_forced",JSON.stringify([...forced]));
}
function loadProgress(){
 try{
  done=new Set(JSON.parse(localStorage.getItem(doneKey())||"[]"));
  forced=new Set(JSON.parse(localStorage.getItem(doneKey()+"_forced")||"[]"));
 }catch{done=new Set();forced=new Set();}
}
function syncSelected(){
 activities=plans[selectedDay]||[];
 open=-1;
 loadProgress();
}
function selectDay(day){
 if(!plans[day]||!dayEnabled(day))return;
 selectedDay=day;
 syncSelected();
 render();
}
function saveLocal(){plans._settings={enabledDays:{...daySettings}};localStorage.setItem("mijnDagPlans",JSON.stringify(plans));}
function loadLocal(){
 try{
  const x=JSON.parse(localStorage.getItem("mijnDagPlans"));
  if(x && !Array.isArray(x) && x.maandag){plans={...plans,...x};if(x._settings?.enabledDays)daySettings={...daySettings,...x._settings.enabledDays};}
  else if(Array.isArray(x)) plans.maandag=x;
 }catch{}
 // Always open on today's weekday. Never restore an old weekday from a previous session.
 selectedDay=fallbackDay();
 if(!plans[selectedDay])selectedDay="maandag";
 syncSelected();
}

function activeIndex(){
 const n=new Date().getHours()*60+new Date().getMinutes();
 for(let i=0;i<activities.length;i++){
  if(done.has(i)) continue;
  if(forced.has(i) || mins(activities[i][0])<=n) return i;
  break;
 }
 return -1;
}

function loginErrorMessage(e){
 const m=(e?.message||"").toLowerCase();
 if(m.includes("invalid login credentials")) return "❌ E-mailadres of wachtwoord klopt niet.";
 if(m.includes("email not confirmed")) return "📧 Dit e-mailadres is nog niet bevestigd in Supabase.";
 if(m.includes("too many requests")) return "⏳ Er zijn te veel inlogpogingen. Wacht even en probeer opnieuw.";
 if(m.includes("failed to fetch")||m.includes("network")) return "🌐 Verbinding met Supabase mislukt.";
 if(m.includes("apikey")||m.includes("api key")) return "🔑 De Supabase-sleutel in de app klopt niet.";
 return "❌ Inloggen mislukt: "+(e?.message||"onbekende fout");
}
async function refreshSession(){if(!client)return;const {data}=await client.auth.getSession();session=data.session;}
async function saveParentName(name){const clean=String(name||"").trim();if(!clean||!client)return false;const {data,error}=await client.auth.updateUser({data:{display_name:clean}});if(error)throw error;session=data.session||session;return true;}
async function loginParent(email,password){const {data,error}=await client.auth.signInWithPassword({email,password});if(error)throw error;session=data.session;}
async function syncLoad(){
 if(!client)return;
 try{
  const {data,error}=await client.from("day_plans").select("plan,updated_at").order("updated_at",{ascending:false}).limit(1).maybeSingle();
  if(error)throw error;
  if(data?.plan){
   const oldDayPlan=JSON.stringify(plans[selectedDay]||[]);
   if(Array.isArray(data.plan)) plans.maandag=data.plan;
   else if(data.plan && typeof data.plan==="object"){plans={...plans,...data.plan};if(data.plan._settings?.enabledDays)daySettings={...daySettings,...data.plan._settings.enabledDays};}
   const newDayPlan=JSON.stringify(plans[selectedDay]||[]);
   saveLocal();
   // Do NOT reset today's completed tasks on every 60-second sync.
   // Only reset progress when the actual planning for this day changed.
   if(oldDayPlan!==newDayPlan){
     syncSelected();
   }else{
     activities=plans[selectedDay]||[];
   }
  }
 }catch(e){console.warn("syncLoad",e)}
}
async function syncSave(){
 plans[selectedDay]=activities;
 saveLocal();
 if(!client||!session?.user)return false;
 try{
  const {data:existing,error:e1}=await client.from("day_plans").select("id").eq("owner_id",session.user.id).maybeSingle();
  if(e1)throw e1;
  const payload={plan:plans,updated_at:new Date().toISOString()};
  if(existing){const {error}=await client.from("day_plans").update(payload).eq("id",existing.id);if(error)throw error;}
  else{const {error}=await client.from("day_plans").insert({owner_id:session.user.id,...payload});if(error)throw error;}
  return true;
 }catch(e){console.warn("syncSave",e);return false}
}
async function logoutParent(){await client.auth.signOut();session=null;mode="child";syncSelected();render()}

function dayTabs(){
 return `<div class="panel" style="margin-bottom:14px;padding:10px">
   <div style="display:flex;gap:6px;overflow:auto">
    ${dayOrder().map(d=>`<button class="btn ${d===selectedDay?"primary":""}" data-day="${d}" style="flex:1;min-width:76px">${DAY_NAMES[d].slice(0,2)}</button>`).join("")}
   </div>
   <div style="text-align:center;font-weight:800;margin-top:7px">🌈 ${DAY_NAMES[selectedDay]}</div>
 </div>`;
}

function childView(){
 const a=activeIndex(), nowMin=new Date().getHours()*60+new Date().getMinutes();
 let next=-1;
 for(let i=0;i<activities.length;i++){if(!done.has(i)&&mins(activities[i][0])>nowMin){next=i;break;}}
 const upcoming=activities.map((item,i)=>({...item,_i:i})).filter(item=>item._i>a&&!done.has(item._i)).slice(0,5);
 const outlookHtml=upcoming.length?`<div class="panel" style="margin-top:14px;text-align:left">
   <div style="font-size:20px;font-weight:850">🌈 Dit komt er nog aan</div>
   <div class="muted" style="margin-top:4px;font-size:16px">Een klein vooruitzicht van jouw ${DAY_NAMES[selectedDay].toLowerCase()}.</div>
   <div style="margin-top:10px">${upcoming.map((item,idx)=>`<div style="display:flex;align-items:center;gap:11px;padding:10px 0;${idx<upcoming.length-1?'border-bottom:1px solid #e7eaf0;':''}">
     <div class="picto" style="width:42px;height:42px;font-size:25px">${item[1]}</div><div style="flex:1">${selectedDay!=="zaterdag"?`<div style="font-size:16px;color:#687386">${item[0]}</div>`:""}<div style="font-size:18px;font-weight:800">${escHtml(item[2])}</div>${idx===0?'<div style="font-size:14px;color:#687386">Hierna</div>':''}</div></div>`).join("")}</div>
 </div>`:"";
 if(a<0){
  if(next>=0 && selectedDay!=="zaterdag"){
   const x=activities[next];
   main.innerHTML=dayTabs()+`<div class="panel" style="padding:28px 20px;text-align:center">
     <div style="display:inline-block;background:rgba(255,122,69,.12);color:#ffb47f;border:1px solid rgba(255,122,69,.35);border-radius:999px;padding:8px 18px;font-size:20px;font-weight:900">⏳ NOG EVEN</div>
     <div style="font-size:76px;margin:18px 0 8px">${x[1]}</div>
     <div style="font-size:32px;font-weight:850">${escHtml(x[2])}</div>
     <div class="muted" style="font-size:19px;margin-top:8px">Deze activiteit begint om ${x[0]}.</div>
     <div class="panel" style="margin-top:22px;text-align:center">
       <div style="font-size:52px">📖</div>
       <div style="font-size:25px;font-weight:900;margin-top:4px">Je mag even een boekje lezen.</div>
       <div class="muted" style="font-size:16px;margin-top:5px">Je hoeft niet te wachten zonder iets te doen.</div>
     </div>
     <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px">
       <button class="btn" id="skipNext" style="font-size:18px;padding:13px 17px">⏭️ Taak overslaan</button>
       <button class="btn primary" id="continueNext" style="font-size:18px;padding:13px 17px">▶️ Toch doorgaan</button>
     </div>
     <div id="waitConfirm" style="margin-top:14px"></div>
   </div>${outlookHtml}`;
   const skip=document.getElementById("skipNext"), cont=document.getElementById("continueNext"), confirm=document.getElementById("waitConfirm");
   if(skip) skip.onclick=()=>{
     confirm.innerHTML=`<div class="panel" style="padding:16px">
       <div style="font-size:20px;font-weight:850">Weet je het zeker?</div>
       <div class="muted" style="margin:6px 0 12px">Je slaat <strong>${escHtml(x[2])}</strong> over.</div>
       <button class="btn primary" id="confirmSkip">Ja, overslaan</button>
       <button class="btn" id="cancelWait" style="margin-left:6px">Nee</button>
     </div>`;
     document.getElementById("confirmSkip").onclick=()=>{done.add(next);forced.delete(next);saveProgress();open=-1;render()};
     document.getElementById("cancelWait").onclick=()=>{confirm.innerHTML=""};
   };
   if(cont) cont.onclick=()=>{
     confirm.innerHTML=`<div class="panel" style="padding:16px">
       <div style="font-size:20px;font-weight:850">Weet je het zeker?</div>
       <div class="muted" style="margin:6px 0 12px">Deze activiteit begint nog niet. Wil je toch doorgaan?</div>
       <button class="btn primary" id="confirmContinue">Ja, doorgaan</button>
       <button class="btn" id="cancelWait2" style="margin-left:6px">Nee</button>
     </div>`;
     document.getElementById("confirmContinue").onclick=()=>{forced.add(next);saveProgress();open=-1;render()};
     document.getElementById("cancelWait2").onclick=()=>{confirm.innerHTML=""};
   };
  }else main.innerHTML=dayTabs()+`<div class="panel" style="padding:32px;text-align:center"><div style="font-size:80px">🎉</div><div style="font-size:32px;font-weight:850;margin-top:8px">De ${DAY_NAMES[selectedDay].toLowerCase()} is klaar!</div><div class="muted" style="font-size:19px;margin-top:8px">Goed gedaan!</div></div>`;
  bindDayTabs();return;
}
 const x=activities[a];
 // Toon instructies direct, als losse visuele stappen. De tekst blijft inhoudelijk hetzelfde.
 const detailLines=(x[3]||"").split(/\n+/).map(s=>s.trim()).filter(Boolean)
   .flatMap(line=>line.split(/(?<=[.!?])\s+(?=[A-ZÀ-Ý0-9])/).map(s=>s.trim()).filter(Boolean));
 const instructionsHtml=detailLines.length?`<div class="activity-instructions">
   <div class="instruction-heading"><span style="font-size:30px">🧭</span><span>Wat moet ik doen?</span></div>
   <ul class="instruction-list">${detailLines.map((line,i)=>`<li class="instruction-item"><span class="instruction-bullet">${i+1}</span><span>${escHtml(line)}</span></li>`).join("")}</ul>
 </div>`:`<div class="activity-instructions"><div class="instruction-heading">🌟 Dit is jouw activiteit!</div></div>`;
 main.innerHTML=dayTabs()+`<div class="panel activity-screen" style="text-align:center">
   <div class="activity-head">
     <div class="activity-emoji">${x[1]}</div>
     <div>
       <div style="display:inline-block;background:rgba(57,255,176,.12);color:#8bffd3;border:1px solid rgba(57,255,176,.35);border-radius:999px;padding:8px 18px;font-size:20px;font-weight:950">🟢 NU</div>
       <div class="activity-title">${escHtml(x[2])}</div>
       ${selectedDay!=="zaterdag"?`<div class="activity-time">🕒 ${x[0]} uur</div>`:""}
       ${forced.has(a)?'<div style="margin-top:8px;color:#ffb47f;font-weight:800">⚡ Eerder gestart</div>':""}
     </div>
   </div>
   ${instructionsHtml}
   <div class="activity-actions">
     <button class="btn primary" id="doneCurrent">✅ KLAAR!</button>
   </div>
 </div>
 <div class="panel activity-progress"><div style="display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-bottom:8px">${activities.map((_,i)=>`<span style="width:12px;height:12px;border-radius:50%;display:inline-block;background:${done.has(i)?"#39ffb0":i===a?"#20d9ff":"#53657b"}"></span>`).join("")}</div><div class="muted">${done.size} van ${activities.length} activiteiten klaar</div></div>
 ${outlookHtml}`;
 bindDayTabs();
 const d=document.getElementById("doneCurrent"); if(d)d.onclick=()=>{done.add(a);forced.delete(a);saveProgress();open=-1;render()};
}

function bindDayTabs(){document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>selectDay(b.dataset.day));}

function parentView(){
 if(!session?.user){
  main.innerHTML=`<div class="panel"><div style="font-size:24px;font-weight:800">🔐 Ouderomgeving</div><div class="muted" style="margin:7px 0 16px">Log in om de dagplanning te wijzigen.</div><div class="grid">
  <label class="muted">E-mailadres<input id="loginEmail" type="email" autocomplete="username" placeholder="jouw e-mailadres"></label>
  <label class="muted">Wachtwoord<input id="loginPassword" type="password" autocomplete="current-password" placeholder="wachtwoord"></label>
  <button class="btn" id="showPassword" type="button">👁️ Wachtwoord tonen</button><button class="btn primary" id="login">Inloggen</button><div id="loginMsg"></div></div></div>`;
  document.getElementById("showPassword").onclick=()=>{const p=document.getElementById("loginPassword"),b=document.getElementById("showPassword");p.type=p.type==="password"?"text":"password";b.textContent=p.type==="password"?"👁️ Wachtwoord tonen":"🙈 Wachtwoord verbergen";};
  document.getElementById("login").onclick=async()=>{const email=document.getElementById("loginEmail").value.trim(),password=document.getElementById("loginPassword").value,msg=document.getElementById("loginMsg");msg.className="muted";msg.textContent="Bezig met inloggen…";try{await loginParent(email,password);await syncLoad();render()}catch(e){msg.className="error";msg.textContent=loginErrorMessage(e);console.warn(e)}};
  return;
 }
 const parentName=(session.user.user_metadata?.display_name||"").trim();
 if(!parentName){
  main.innerHTML=`<div class="panel" style="padding:24px"><div style="font-size:28px;font-weight:850">👋 Welkom!</div><div class="muted" style="font-size:17px;margin:8px 0 18px">Dit is de eerste keer dat je hier inlogt. Hoe mogen we je noemen?</div><div class="grid"><label class="muted">Jouw naam<input id="parentName" type="text" autocomplete="name" placeholder="Bijvoorbeeld Jan Hendrik"></label><button class="btn primary" id="saveParentName">Doorgaan</button><div id="nameMsg"></div></div></div>`;
  document.getElementById("saveParentName").onclick=async()=>{const name=document.getElementById("parentName").value.trim(),msg=document.getElementById("nameMsg");if(!name){msg.className="error";msg.textContent="Vul eerst je naam in.";return}msg.className="muted";msg.textContent="Opslaan…";try{await saveParentName(name);render()}catch(e){msg.className="error";msg.textContent="Naam opslaan lukt niet."}};
  return;
 }
 let html=dayTabs()+`<div class="panel" style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><b>👩 Ouderomgeving</b><div style="font-size:20px;font-weight:850;margin-top:5px">Hallo ${escHtml(parentName)}! 👋</div><div class="muted" style="margin-top:3px">Je bent ingelogd als: ${escHtml(parentName)}</div></div><button class="btn" id="logout">Uitloggen</button></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn primary" id="saveOnline">☁️ Online opslaan</button><span id="saveMsg" class="muted" style="align-self:center"></span></div></div><div class="panel" style="margin-bottom:14px"><b>🗓️ Weekend instellen</b><div class="muted" style="margin:5px 0 12px">Zet de dagen aan waarop je een eigen planning wilt maken. In de kindweergave verschijnen alleen ingeschakelde dagen.</div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr))"><label style="display:flex;align-items:center;gap:12px;font-size:18px"><input type="checkbox" id="enableSaturday" ${daySettings.zaterdag?"checked":""} style="width:22px;height:22px"> Zaterdag gebruiken</label><label style="display:flex;align-items:center;gap:12px;font-size:18px"><input type="checkbox" id="enableSunday" ${daySettings.zondag?"checked":""} style="width:22px;height:22px"> Zondag gebruiken</label></div><div class="muted" style="margin-top:8px">Als je een dag aanzet, kun je hieronder activiteiten voor die dag toevoegen.</div></div><div class="grid">`;
 activities.forEach((x,i)=>html+=`<div class="panel" draggable="true" data-task-card="${i}" style="border:1px solid rgba(32,217,255,.24)"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><div class="picto">${x[1]}</div><div style="flex:1;min-width:120px">${selectedDay!=="zaterdag"?`<div class="muted">${x[0]}</div>`:""}<b>${escHtml(x[2])}</b></div><div style="display:flex;gap:5px;align-items:center"><button class="btn" title="Taak omhoog" aria-label="Taak omhoog" data-up="${i}" ${i===0?'disabled':''}>⬆️</button><button class="btn" title="Taak omlaag" aria-label="Taak omlaag" data-down="${i}" ${i===activities.length-1?'disabled':''}>⬇️</button><button class="btn" data-edit="${i}">✏️ Bewerken</button><button class="btn" style="border-color:#ff6b81;color:#ff9aaa" data-delete="${i}">🗑️</button></div></div><div class="muted" style="font-size:12px;margin-top:7px">Gebruik ⬆️ en ⬇️ om de taak te verplaatsen. Je kunt de taak ook slepen.</div><div class="editor ${open===i?"open":""}" data-editor="${i}"><div class="grid">
 ${selectedDay!=="zaterdag"?`<label class="muted">Tijd<input class="et" value="${escHtml(x[0])}"></label>`:`<input class="et" value="00:00" type="hidden">`}<label class="muted">Pictogram<input class="ep" value="${escHtml(x[1])}" maxlength="2"></label>
 <label class="muted">Korte tekst<input class="en" value="${escHtml(x[2])}"></label><label class="muted">Extra informatie<textarea class="ei">${escHtml(x[3])}</textarea></label>
 <button class="btn primary save" data-save="${i}">Opslaan</button></div></div></div>`);
 html+=`</div><div class="panel" style="margin-top:12px"><b>➕ Activiteit toevoegen</b><div class="grid" style="margin-top:10px">${selectedDay!=="zaterdag"?`<input id="nt" placeholder="Tijd, bijvoorbeeld 19:00">`:`<input id="nt" value="00:00" type="hidden">`}<input id="np" placeholder="Pictogram, bijvoorbeeld ⭐"><input id="nn" placeholder="Naam"><textarea id="ni" placeholder="Extra informatie"></textarea><button class="btn primary" id="add">Toevoegen</button></div></div>`;
 main.innerHTML=html;bindDayTabs();
 const saveWeekendSettings=async()=>{daySettings.zaterdag=document.getElementById("enableSaturday").checked;daySettings.zondag=document.getElementById("enableSunday").checked;plans._settings={enabledDays:{...daySettings}};if(!dayEnabled(selectedDay)){selectedDay="vrijdag";syncSelected();}saveLocal();const ok=await syncSave();render();const msg=document.getElementById("saveMsg");if(msg)msg.textContent=ok?"Weekendinstellingen opgeslagen ✓":"Lokaal opgeslagen; online opslaan is niet gelukt";};
 document.getElementById("enableSaturday").onchange=saveWeekendSettings;
 document.getElementById("enableSunday").onchange=saveWeekendSettings;
 document.getElementById("logout").onclick=logoutParent;
 document.getElementById("saveOnline").onclick=async()=>{const msg=document.getElementById("saveMsg");msg.textContent="Opslaan…";msg.textContent=await syncSave()?"Opgeslagen ✓":"Opslaan mislukt"};
 const reorderTask=async(i,delta)=>{const j=i+delta;if(j<0||j>=activities.length)return;const firstTime=activities[i][0],secondTime=activities[j][0];[activities[i],activities[j]]=[activities[j],activities[i]];activities[i][0]=firstTime;activities[j][0]=secondTime;plans[selectedDay]=activities;done=new Set();forced=new Set();saveProgress();open=-1;saveLocal();await syncSave();render();};
 main.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>reorderTask(+b.dataset.up,-1));
 main.querySelectorAll("[data-down]").forEach(b=>b.onclick=()=>reorderTask(+b.dataset.down,1));
 main.querySelectorAll("[data-delete]").forEach(b=>b.onclick=async()=>{const i=+b.dataset.delete,task=activities[i];if(!task)return;if(!confirm(`Weet je zeker dat je de taak "${task[2]}" wilt verwijderen? Dit kan niet automatisch ongedaan worden gemaakt.`))return;activities.splice(i,1);plans[selectedDay]=activities;done=new Set();forced=new Set();saveProgress();open=-1;saveLocal();await syncSave();render();});
 main.querySelectorAll("[data-task-card]").forEach(card=>{card.addEventListener("dragstart",e=>{e.dataTransfer.setData("text/plain",card.dataset.taskCard);e.dataTransfer.effectAllowed="move";});card.addEventListener("dragover",e=>{e.preventDefault();e.dataTransfer.dropEffect="move";});card.addEventListener("drop",e=>{e.preventDefault();const from=Number(e.dataTransfer.getData("text/plain")),to=Number(card.dataset.taskCard);if(Number.isInteger(from)&&Number.isInteger(to)&&from!==to){const delta=to>from?1:-1;const moveTo=async()=>{const task=activities.splice(from,1)[0];activities.splice(to,0,task);const times=activities.map(a=>a[0]).sort((a,b)=>mins(a)-mins(b));activities.forEach((a,i)=>a[0]=times[i]);plans[selectedDay]=activities;done=new Set();forced=new Set();saveProgress();open=-1;saveLocal();await syncSave();render();};moveTo();}});});
 main.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{open=open===+b.dataset.edit?-1:+b.dataset.edit;render()});
 main.querySelectorAll("[data-save]").forEach(b=>b.onclick=async()=>{const i=+b.dataset.save,e=main.querySelector(`[data-editor="${i}"]`);activities[i]=[e.querySelector(".et").value||activities[i][0],e.querySelector(".ep").value||activities[i][1],e.querySelector(".en").value||activities[i][2],e.querySelector(".ei").value];activities.sort((a,b)=>mins(a[0])-mins(b[0]));plans[selectedDay]=activities;done=new Set();forced=new Set();saveProgress();open=-1;await syncSave();render()});
 document.getElementById("add").onclick=async()=>{const t=document.getElementById("nt").value.trim(),p=document.getElementById("np").value.trim()||"⭐",n=document.getElementById("nn").value.trim(),inf=document.getElementById("ni").value.trim();if(!t||!n)return;activities.push([t,p,n,inf]);activities.sort((a,b)=>mins(a[0])-mins(b[0]));plans[selectedDay]=activities;done=new Set();forced=new Set();saveProgress();await syncSave();render()};
}

function render(){
 document.getElementById("childBtn").className="btn"+(mode==="child"?" primary":"");
 document.getElementById("parentBtn").className="btn"+(mode==="parent"?" primary":"");
 mode==="child"?childView():parentView();
}
document.getElementById("childBtn").onclick=()=>{mode="child";open=-1;render()};
document.getElementById("parentBtn").onclick=()=>{mode="parent";open=-1;render()};
loadLocal();

if(CONFIG.url&&CONFIG.key&&window.supabase){
 client=supabase.createClient(CONFIG.url,CONFIG.key);
 refreshSession().then(()=>syncLoad()).then(()=>render());
 client.auth.onAuthStateChange((_event,s)=>{session=s;render()});
}else render();

setInterval(()=>{
 if(mode==="child"){
   const today=todayDay();
   if(dayEnabled(today) && plans[today] && selectedDay!==today){
     selectedDay=today;
     syncSelected();
   }
   syncLoad().then(render);
 }
},60000);
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
